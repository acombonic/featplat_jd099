[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acombonic-featplat_jd099"
version = "0.1.0"
description = "把候选项映射到类别上，算出特征平台工程师·回归集与线上样本的差分的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "acombonic" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://acombonic.github.io"
Repository = "https://github.com/acombonic/featplat_jd099"
Issues = "https://github.com/acombonic/featplat_jd099/issues"

[project.scripts]
featplat_jd099 = "featplat_jd099:main"

[tool.setuptools]
py-modules = ["featplat_jd099"]
